name: Build

on:
  workflow_dispatch:
  pull_request:
    paths: &build-paths
      - ".github/workflows/build.yml"
      - ".github/icon-parts/**"
      - "common/**"
      - "fabric/**"
      - "neoforge/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  push:
    branches: ["master", "fix-1.21.11-mob-accuracy"]
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MoM Backport
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: microsoft
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Restore exact mod icon
        run: |
          cat .github/icon-parts/part0.b64 \
              .github/icon-parts/part1.b64 \
              .github/icon-parts/part2.b64 \
              .github/icon-parts/part3.b64 \
              .github/icon-parts/part4.b64 \
              .github/icon-parts/part5.b64 \
              .github/icon-parts/part6.b64 \
            | base64 --decode > common/src/main/resources/assets/barched/icon.png
          test "$(wc -c < common/src/main/resources/assets/barched/icon.png)" -eq 19595
          test "$(sha1sum common/src/main/resources/assets/barched/icon.png | cut -d' ' -f1)" = "e4ad54b31cf26369c8519b0cbbe055f81f9219a8"

      - name: Build Fabric and NeoForge
        run: ./gradlew build --build-cache --stacktrace

      - name: Upload Fabric JARs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MoMBackport-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-all.jar
            !fabric/build/libs/*-dev-shadow.jar
          if-no-files-found: error
          archive: false

      - name: Upload NeoForge JARs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MoMBackport-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-all.jar
            !neoforge/build/libs/*-dev-shadow.jar
          if-no-files-found: error
          archive: false
