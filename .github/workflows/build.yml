name: Build
# The mod icon is packaged from common resources, so icon updates are validated by this build.

on:
  workflow_dispatch:
  pull_request:
    paths: &build-paths
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
      - "common/**"
      - "fabric/**"
      - "neoforge/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  push:
    branches: ["master"]
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MoM Backport
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: microsoft
          verify-signature: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build Fabric and NeoForge
        run: ./gradlew build --build-cache --stacktrace

      - name: Verify recovered content and packaged resources
        run: python3 .github/scripts/verify_artifacts.py

      - name: Smoke test Fabric client startup
        run: python3 .github/scripts/smoke_client.py

      - name: Upload client smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MoMBackport-client-smoke-diagnostics
          path: |
            fabric/build/client-smoke.log
            fabric/run/crash-reports/**
            fabric/run/logs/**
          if-no-files-found: warn
          archive: true

      - name: Upload Fabric JARs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MoMBackport-fabric
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-sources.jar
            !fabric/build/libs/*-all.jar
            !fabric/build/libs/*-dev-shadow.jar
          if-no-files-found: error
          archive: false

      - name: Upload NeoForge JARs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MoMBackport-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-all.jar
            !neoforge/build/libs/*-dev-shadow.jar
          if-no-files-found: error
          archive: false
