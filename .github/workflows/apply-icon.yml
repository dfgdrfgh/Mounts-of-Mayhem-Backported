name: Apply exact mod icon

on:
  push:
    paths:
      - ".github/icon-upload/**"
      - ".github/workflows/apply-icon.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Reconstruct exact uploaded icon
        run: |
          cat .github/icon-upload/part0.b64 \
              .github/icon-upload/part1.b64 \
              .github/icon-upload/part2.b64 \
              .github/icon-upload/part3.b64 \
            | base64 --decode > common/src/main/resources/assets/barched/icon.png
          test "$(wc -c < common/src/main/resources/assets/barched/icon.png)" -eq 19033
          test "$(sha256sum common/src/main/resources/assets/barched/icon.png | cut -d' ' -f1)" = "f30d2ea63f3d1cf4f2d94289f30bd0cbab5b33b440cbca3fa2c489545f862b77"
      - name: Commit icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add common/src/main/resources/assets/barched/icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Update mod icon to latest approved image"
          git push
